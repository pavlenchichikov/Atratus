name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Lint doesn't require heavy dependencies - runs in seconds
  # and gives fast feedback without waiting for TensorFlow to install.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned to the version the codebase is linted against locally. The pin
        # is what makes an upgrade deliberate: unpinned, a new default rule set
        # lands as a red build on code nobody touched. Bump it on purpose, fix
        # what the new rules find, and move the pin in the same commit.
        run: pip install ruff==0.16.1

      - name: Lint (ruff)
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Tests (pytest)
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
          CUDA_VISIBLE_DEVICES: ""
        run: pytest tests/ -q
